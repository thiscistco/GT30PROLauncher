<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GT30 PRO Launcher — Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0a0c0f;
    color: #e9ecf1;
    overflow-x: hidden;
  }

  /* ===== Latar halaman: wallpaper yang sama, di-blur & digelapkan ===== */
  .bg {
    position: fixed;
    inset: -6%;
    background: url("assets/gt30pro-internals.jpg?v=29") center/cover no-repeat;
    filter: blur(52px) saturate(1.15) brightness(0.34);
    transform: scale(1.08);
    z-index: 0;
  }
  .bg-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, rgba(10,12,15,0.25), rgba(10,12,15,0.78) 75%);
    z-index: 1;
  }

  .wrap {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 32px;
    gap: 18px;
  }

  header { text-align: center; font-family: 'Doto', monospace; }
  .mode-toggle button { font-family: 'Doto', monospace; }
  .kicker {
    font-size: 11px;
    letter-spacing: 2.6px;
    text-transform: uppercase;
    color: #f7a23b;
    font-weight: 600;
  }
  h1 { font-size: clamp(18px, 3vw, 25px); font-weight: 700; margin-top: 6px; letter-spacing: 0.2px; }
  .sub { margin-top: 6px; font-size: 12.5px; color: #a7aeba; max-width: 620px; line-height: 1.55; }

  /* ===== Toggle mode ===== */
  .mode-toggle {
    display: inline-flex;
    gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px;
    padding: 4px;
  }
  .mode-toggle button {
    border: 0;
    background: transparent;
    color: #aab2be;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.2px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .18s ease;
  }
  .mode-toggle button.active {
    background: #f7a23b;
    color: #14161a;
    box-shadow: 0 4px 14px rgba(247, 162, 59, 0.35);
  }
  .mode-toggle button:hover:not(.active) { color: #e9ecf1; background: rgba(255,255,255,0.07); }

  /* ===== Panggung ===== */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(22px, 4vw, 52px);
    flex-wrap: wrap;
    width: 100%;
  }

  /* ===== SKALA NYATA 1:1 (satuan CSS mm — 1mm = 3,7795 px @96dpi) ===== */
  .phone-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: transform .25s ease;
  }

  /* ===== Bodi ponsel — ukuran asli 75,8 × 163,7 mm ===== */
  .phone {
    position: relative;
    width: 75.8mm;
    height: 163.7mm;
    border-radius: 10.5mm;
    background:
      linear-gradient(152deg, #33373d 0%, #1b1e22 26%, #111316 62%, #1d2126 100%);
    box-shadow:
      inset 0 0 0 0.3mm rgba(255, 255, 255, 0.10),
      inset 0 0 0 1mm rgba(0, 0, 0, 0.55),
      0 34px 70px rgba(0, 0, 0, 0.62),
      0 8px 22px rgba(0, 0, 0, 0.45);
  }

  /* ===== Layar: bezel nyata ± 2,5 mm samping / ± 3 mm atas-bawah ===== */
  .screen {
    position: absolute;
    left:  2.45mm;
    right: 2.45mm;
    top:    3.0mm;
    bottom: 3.0mm;
    border-radius: 8.4mm;
    overflow: hidden;
    box-shadow: inset 0 0 0 0.25mm rgba(0, 0, 0, 0.85);
    z-index: 2;
  }
  .wallpaper {
    position: absolute;
    inset: 0;
    background: url("assets/gt30pro-internals.jpg?v=29") center/cover no-repeat;
    transition: transform .12s ease-out, filter .12s ease-out;
    will-change: transform, filter;
  }
  @font-face {
    font-family: 'Doto';
    src: url('assets/fonts/Doto.ttf?v=1') format('truetype');
    font-weight: 100 900;
  }
  .battery-led {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 1.2%;
    font-family: 'Doto', monospace;
    font-size: 2.8mm;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.2mm;
    color: #ffffff;
    opacity: 0.6;
    text-shadow: 0 0 1.2mm rgba(255, 255, 255, 0.55);
    z-index: 6;
  }
  .clock-led {
    position: absolute;
    left: 35.7%;
    transform: translateX(-50%);
    bottom: calc(6% + 3px);
    font-family: 'Doto', monospace;
    font-size: 1.8mm;
    font-weight: 700;
    font-variation-settings: 'wght' 700;
    letter-spacing: 0.2mm;
    color: #ffc477;
    opacity: 1;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.15;
  }
  .phone-row { display: flex; align-items: stretch; }
  .charging-toggle { color: #c3cad4; font: 600 12px 'Doto', monospace; display: flex; gap: 8px; align-items: center; }
  .charging-toggle input { accent-color: #f7a23b; }
  .super-page { position: absolute; inset: 0; z-index: 9; padding: 8mm 5mm;
    background: #000;
    font-family: 'Doto', monospace; font-weight: 700; }
  .super-page[hidden] { display: none; }
  .super-back { border: 0; background: none; color: #9aa3b0; font: inherit; font-size: 3mm; min-height: 12mm; cursor: pointer; }
  .super-page h2 { margin-top: 2mm; font-size: 6.5mm; color: #eceff4; }
  .super-page p { margin-top: 1mm; font-size: 2.8mm; color: #9aa3b0; }
  .super-card { width: 100%; display: flex; align-items: center; gap: 3mm; margin-top: 5mm; padding: 3.5mm;
    border: 1px solid rgba(255,255,255,.1); border-radius: 5mm; background: #1c2128; color: #eceff4; text-align: left; font: inherit; cursor: pointer; }
  .super-icon { display: grid; place-items: center; width: 12mm; height: 12mm; border-radius: 4mm; background: rgba(247,162,59,.15); font-size: 5.5mm; }
  .super-card-text { display: grid; gap: 1mm; }
  .super-card-text strong { font-size: 3.5mm; }
  .super-card-text small { color: #9aa3b0; font-size: 2.6mm; }
  .clock-led { cursor: pointer; }
  .clock-led::before {
    content: "";
    position: absolute;
    width: 12mm;
    height: 12mm;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  .clock-led:focus-visible { outline: 1px solid #ffc477; outline-offset: 3px; }
  .clock-led > span:not(.clock-sep) {
    background: linear-gradient(to bottom, #cb633e 0%, #ffb568 24%, #ffe5b1 50%, #ffb568 76%, #cb633e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 0.65mm rgba(221, 98, 52, 0.65));
  }
  .clock-sep {
    display: block;
    position: relative;
    left: -0.63px;
    width: calc(100% - 0.76px);
    height: 0.22mm;
    background: radial-gradient(circle 0.11mm at center, #ffe5b1 0%, #ffb568 55%, #cb633e 90%, transparent 100%) 50% 50% / 20% 100% repeat-x;
    filter: drop-shadow(0 0 0.6mm rgba(221, 98, 52, 0.65));
    margin: calc(0.461mm - 1px) 0 calc(0.45mm + 1px) 0;
  }
  .clock-sep.charging {
    animation: sepPulse 0.9s ease-in-out infinite alternate;
  }
  .clock-page {
    position: absolute; inset: 0; z-index: 10;
    background: #000;
    padding: 8mm 6mm; font-family: 'Doto', monospace; font-weight: 700;
    color: #ffe5b1;
  }
  .clock-page[hidden] { display: none; }
  .clock-back { border: 0; background: none; color: #ffc28b; font: inherit; font-size: 3mm; min-height: 12mm; cursor: pointer; }
  .clock-kicker { margin-top: 7mm; color: #e7a579; font-size: 2.6mm; }
  .clock-title { margin-top: 2mm; font-size: 7mm; }
  .clock-card { margin-top: 7mm; padding: 8mm 3mm; text-align: center; background: rgba(27,24,25,.9); border: 1px solid rgba(231,165,121,.47); border-radius: 5mm; }
  .clock-card-label { color: #e7a579; font-size: 2.6mm; }
  .clock-card-time { margin-top: 4mm; font-size: 8mm; color: #ffd49d; text-shadow: 0 0 2mm rgba(221,98,52,.65); }
  .clock-card-date { margin-top: 3mm; font-size: 2.8mm; color: #eed3bd; }
  @keyframes sepPulse {
    from { opacity: 0.35; filter: drop-shadow(0 0 0.25mm rgba(221, 98, 52, 0.35)); }
    to   { opacity: 1;    filter: drop-shadow(0 0 0.9mm rgba(221, 98, 52, 0.85)); }
  }
  .sheen {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background:
      linear-gradient(118deg,
        rgba(255, 255, 255, 0.10) 0%,
        rgba(255, 255, 255, 0.02) 22%,
        transparent 45%,
        transparent 78%,
        rgba(255, 255, 255, 0.05) 100%);
    border-radius: inherit;
  }

  /* ===== Punch-hole kamera depan 13 MP (tengah atas) ===== */
  .punch-hole {
    position: absolute;
    top: 2.7mm;
    left: 50%;
    transform: translateX(-50%);
    width:  3.9mm;
    height: 3.9mm;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #2e343d 0%, #0b0e13 52%, #04060a 100%);
    box-shadow:
      0 0 0 0.5mm rgba(0, 0, 0, 0.9),
      inset 0 0 0.7mm rgba(90, 130, 220, 0.28);
    z-index: 5;
  }
  .punch-hole::after {
    content: "";
    position: absolute;
    top: 22%; left: 26%;
    width: 26%; height: 26%;
    border-radius: 50%;
    background: rgba(140, 180, 255, 0.5);
    filter: blur(0.1mm);
  }

  /* ===== Tombol sisi kanan: Volume +, Volume −, Power ===== */
  .side-btn {
    position: absolute;
    right: -1.35mm;
    width: 1.8mm;
    border-radius: 0.9mm;
    background: linear-gradient(90deg, #43484f 0%, #262a30 55%, #14171b 100%);
    box-shadow:
      inset 0 0.3mm 0.3mm rgba(255, 255, 255, 0.22),
      0.6mm 0.8mm 2mm rgba(0, 0, 0, 0.55);
    z-index: 1;
  }
  .vol-up   { top: 27mm;  height: 11mm; }
  .vol-down { top: 39.5mm; height: 11mm; }
  .power    { top: 58.5mm; height: 13.5mm; width: 2.05mm; }

  /* ===== Penggaris 10 cm (nyata) ===== */
  .ruler-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    margin-top: 6px;
  }
  .ruler-title {
    font-size: 10px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #8b93a1;
    font-weight: 600;
  }
  .ruler {
    width: 100mm;
    height: 9mm;
    border: 0.25mm solid rgba(247, 162, 59, 0.5);
    border-top: 0;
    background-image:
      repeating-linear-gradient(90deg, rgba(247,162,59,0.95) 0 0.22mm, transparent 0.22mm 5mm),
      repeating-linear-gradient(90deg, rgba(247,162,59,0.55) 0 0.18mm, transparent 0.18mm 1mm);
    background-size: 100% 5.5mm, 100% 3mm;
    background-position: 0 0, 0 0;
    background-repeat: no-repeat;
  }
  .ruler-labels {
    width: 100mm;
    display: flex;
    font-size: 8.5px;
    color: #c99a5c;
    letter-spacing: 0.4px;
  }
  .ruler-labels span { width: 10mm; text-align: left; transform: translateX(-2px); }
  .ruler-labels span:last-child { transform: translateX(-100%); text-align: right; }

</style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-overlay"></div>

  <div class="wrap">
    <header>
      <div class="kicker">GT30 PRO LAUNCHER</div>
      <h1>Preview Launcher</h1>
      <div class="mode-toggle" role="group" aria-label="Pilih tampilan preview" style="margin-top: 14px">
        <button id="tabHome" class="active" type="button" aria-pressed="true">Homescreen</button>
        <button id="tabSuper" type="button" aria-pressed="false">Super App</button>
      </div>
    </header>

    <div class="stage">
      <div class="phone-col" id="phone-col">
        <div class="phone-row">
          <div class="phone">
            <div class="side-btn vol-up"></div>
            <div class="side-btn vol-down"></div>
            <div class="side-btn power"></div>
            <div class="screen">
              <div class="wallpaper" id="wallpaper"></div>
              <div class="clock-led" id="clockLed" role="button" tabindex="0" aria-label="Buka Jam di Super App">
                <span id="clockHour">00</span>
                <span class="clock-sep"></span>
                <span id="clockMin">00</span>
              </div>
              <div class="battery-led" id="batteryLed">85%</div>
              <section class="super-page" id="superPage" aria-label="Super App" hidden>
                <button class="super-back" id="superBack" type="button">← Kembali</button>
                <h2>SUPER APP</h2>
                <p>Aplikasi di dalam launcher</p>
                <button class="super-card" id="openClockModule" type="button">
                  <span class="super-icon" aria-hidden="true">⏱️</span>
                  <span class="super-card-text"><strong>Jam</strong><small>Waktu &amp; tanggal</small></span>
                </button>
              </section>
              <section class="clock-page" id="clockPage" aria-label="Jam di Super App" hidden>
                <button class="clock-back" id="clockBack" type="button">← Kembali</button>
                <div class="clock-kicker">SUPER APP</div>
                <div class="clock-title">JAM</div>
                <div class="clock-card">
                  <div class="clock-card-label">WAKTU SAAT INI</div>
                  <div class="clock-card-time" id="clockPageTime">--:--:--</div>
                  <div class="clock-card-date" id="clockPageDate"></div>
                </div>
              </section>
              <div class="punch-hole"></div>
              <div class="sheen"></div>
            </div>
          </div>
        </div>

        <div class="ruler-box">
          <div class="ruler-title">Penggaris 10 cm · skala nyata</div>
          <div class="ruler"></div>
          <div class="ruler-labels">
            <span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
            <span>6</span><span>7</span><span>8</span><span>9</span><span>10 cm</span>
          </div>
        </div>
      </div>


    </div>

    <label class="charging-toggle"><input type="checkbox" id="chargeToggle" checked> Simulasi pengisian daya</label>

  </div>

<script>
  // ===== Jam HH:mm live + animasi label saat charge (pratinjau) =====
  (function () {
    var sep = document.querySelector('.clock-sep');
    var toggle = document.getElementById('chargeToggle');
    function sync() {
      sep.classList.toggle('charging', toggle.checked);
    }
    toggle.addEventListener('change', sync);
    sync();
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    var hourEl = document.getElementById('clockHour');
    var minEl = document.getElementById('clockMin');
    var clockLed = document.getElementById('clockLed');
    var page = document.getElementById('clockPage');
    var back = document.getElementById('clockBack');
    var superPage = document.getElementById('superPage');
    var homeTab = document.getElementById('tabHome');
    var superTab = document.getElementById('tabSuper');
    var clockOrigin = clockLed;
    function setTab(superActive) {
      page.hidden = true;
      superPage.hidden = !superActive;
      homeTab.classList.toggle('active', !superActive);
      superTab.classList.toggle('active', superActive);
      homeTab.setAttribute('aria-pressed', String(!superActive));
      superTab.setAttribute('aria-pressed', String(superActive));
    }
    homeTab.addEventListener('click', function () { setTab(false); });
    superTab.addEventListener('click', function () { setTab(true); });
    document.getElementById('superBack').addEventListener('click', function () { setTab(false); homeTab.focus(); });
    function openClock(origin) { clockOrigin = origin; page.hidden = false; back.focus(); }
    document.getElementById('openClockModule').addEventListener('click', function () { openClock(this); });
    clockLed.addEventListener('click', function () { openClock(clockLed); });
    clockLed.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openClock(clockLed); }
    });
    back.addEventListener('click', function () { page.hidden = true; clockOrigin.focus(); });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !page.hidden) { page.hidden = true; clockOrigin.focus(); }
    });
    function tick() {
      var d = new Date();
      hourEl.textContent = pad(d.getHours());
      minEl.textContent = pad(d.getMinutes());
      document.getElementById('clockPageTime').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      document.getElementById('clockPageDate').textContent = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d);
      setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
    }
    tick();
  })();
</script>
</body>
</html>
